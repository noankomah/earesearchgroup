# Replace example.org with your domain. Install your TLS certificate before enabling.
# This must be in Nginx's http context (sites-enabled is normally included there).
limit_req_zone $binary_remote_addr zone=earg_login:10m rate=5r/m;

server {
    listen 80;
    server_name example.org www.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name example.org www.example.org;
    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    client_max_body_size 10m;

    location /static/ {
        alias /srv/earg/staticfiles/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ {
        alias /srv/earg/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }
    # Limit both administrative and team sign-in attempts.
    location ~ ^/(admin|team)/login/ {
        limit_req zone=earg_login burst=10 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8001;
    }
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8001;
    }
}
