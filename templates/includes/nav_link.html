{% if link.is_disabled and link.location == "social" %}<span class="footer-placeholder">{{ link.label }}</span>{% else %}<a href="{{ link.public_url }}"{% if link.route %} data-route-link="{{ link.route }}"{% endif %}{% if link.is_disabled %} class="inactive-link" aria-disabled="true" onclick="return false;"{% endif %}{% if link.new_tab %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ link.label }}</a>{% endif %}
